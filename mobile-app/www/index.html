<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResumeFit Pro</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #102a43;
      color: white;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 360px;
    }

    img {
      width: 260px;
      max-width: 88vw;
      height: auto;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    p {
      margin: 0;
      color: #c6d8e6;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="app-logo.png" alt="Resume Pro AI">
    <h1>ResumeFit Pro</h1>
    <p>Loading the AI resume optimizer...</p>
  </main>
</body>
</html>
