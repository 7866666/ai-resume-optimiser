<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
@page {
  size: A4;
  margin: 0;
}

* {
  box-sizing: border-box;
}

body {
  font-family: {{font_family}};
  margin: 0;
  color: #111827;
}

body.template-modern .left {
  background: #0f766e;
}

body.template-fresher .left {
  background: #1d4ed8;
}

body.template-corporate .left {
  background: #374151;
}

body.template-creative .left {
  background: #7c3aed;
}

body.template-product .left {
  background: #7f1d1d;
}

body.template-designer .left {
  background: #be185d;
}

body.template-minimal .page {
  display: block;
  padding: 24px 30px;
}

body.template-minimal .left,
body.template-minimal .right {
  width: 100%;
  background: white;
  color: #111827;
  padding: 0;
}

body.template-minimal .contact a,
body.template-minimal li.skill-subheading {
  color: #111827;
}

body.theme-dark {
  background: #0f172a;
}

body.theme-dark .page {
  background: #111827;
  color: #f8fafc;
}

body.theme-dark .right .section-title {
  border-color: #e5e7eb;
}

body.theme-dark .item-meta {
  color: #cbd5e1;
}

body.theme-dark.template-minimal .left,
body.theme-dark.template-minimal .right {
  background: #111827;
  color: #f8fafc;
}

body.spacing-compact li,
body.spacing-compact p {
  line-height: 1.32;
  margin-bottom: 4px;
}

body.spacing-compact .section-title {
  margin-top: 14px;
}

body.spacing-relaxed li,
body.spacing-relaxed p {
  line-height: 1.75;
  margin-bottom: 9px;
}

body.spacing-relaxed .section-title {
  margin-top: 26px;
}

.page {
  width: 210mm;
  min-height: 297mm;
  margin: auto;
  display: flex;
}

.left {
  width: 30%;
  background: #0f172a;
  color: white;
  padding: 25px;
}

.right {
  width: 70%;
  padding: 30px;
}

.header-name {
  font-size: 22px;
  font-weight: bold;
  line-height: 1.2;
}

.header-role {
  font-size: 13px;
  margin-bottom: 10px;
  color: #cbd5e1;
}

.contact {
  font-size: 12px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.contact-line {
  margin-bottom: 5px;
}

.contact a {
  color: white;
  text-decoration: none;
}

.section-title {
  font-size: 14px;
  font-weight: bold;
  margin-top: 20px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.right .section-title {
  border-bottom: 2px solid #111827;
  padding-bottom: 3px;
}

ul {
  padding-left: 18px;
  margin-top: 0;
}

li {
  margin-bottom: 6px;
  font-size: 13px;
  line-height: 1.45;
}

li strong {
  font-weight: bold;
}

li.skill-subheading {
  list-style: none;
  padding-left: 0;
  margin-left: -18px;
  margin-top: 18px;
  margin-bottom: 8px;
  font-size: 14px;
  line-height: 1.2;
  font-weight: bold;
  text-transform: uppercase;
  color: white;
}

p {
  font-size: 13px;
  line-height: 1.6;
  margin-top: 0;
}

.resume-item {
  margin-bottom: 14px;
}

.resume-item ul {
  margin-bottom: 0;
}

.item-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 2px;
}

.item-meta {
  font-size: 12px;
  color: #64748b;
  margin-bottom: 6px;
}
</style>

</head>

<body class="{{template_class}}">

<div class="page">

<div class="left">
  <div>
    {{header_block}}
  </div>

  <div class="section-title">Skills</div>
  <ul>{{skills}}</ul>

  <div class="section-title">Certifications</div>
  <ul>{{certifications}}</ul>
</div>

<div class="right">
  <div class="section-title">Summary</div>
  <p>{{summary}}</p>

  <div class="section-title">Experience</div>
  <div>{{experience}}</div>

  <div class="section-title">Projects</div>
  <div>{{projects}}</div>

  <div class="section-title">Education</div>
  <p>{{education}}</p>

  <div class="section-title">Achievements</div>
  <ul>{{achievements}}</ul>
</div>

</div>

</body>
</html>
